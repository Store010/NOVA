<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NØVA – Skincare, hair care & cosmetics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2718%27%20fill%3D%27%23140d1f%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2716%27%20fill%3D%27none%27%20stroke%3D%27%23ecca90%27%20stroke-width%3D%276%27/%3E%3Cpath%20d%3D%27M17%2047L47%2017%27%20stroke%3D%27%23ff8fb8%27%20stroke-width%3D%276%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E">
<script>try{var s=localStorage.getItem('gh_theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sx:100%;--ease:cubic-bezier(.2,.8,.2,1)}
html[dir=rtl]{--sx:-100%}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d0814;--bg2:#140d1f;--surf:#1a1227;--surf2:#241836;--ink:#f7f0ea;--mute:#a99cba;--line:#ffffff1c;--rose:#ff6fa5;--gold:#ecca90;--orc:#a98bff;--grad:linear-gradient(115deg,#ecca90,#ff8fb8 55%,#b596ff);--onhot:#1b0f26;--hero:radial-gradient(120% 90% at 20% 0%,#2c1743,#0d0814 72%);--glass:#0d0814b8;--sh:0 24px 60px #0009;--spot:#ffffff1c;--bo:.5}
:root[data-theme=light]{color-scheme:light;--bg:#fbf7fd;--bg2:#f3ebf8;--surf:#fff;--surf2:#f5eef9;--ink:#24142f;--mute:#6e6080;--line:#24142f1a;--rose:#d42a75;--gold:#a3701a;--orc:#7654dc;--grad:linear-gradient(115deg,#e0347c,#a04ad6 60%,#7654dc);--onhot:#fff;--hero:radial-gradient(120% 90% at 20% 0%,#ffdcec,#f2e6fb 55%,#e4dafb);--glass:#fbf7fdc7;--sh:0 24px 50px #4a2a6a26;--spot:#ffffffb0;--bo:.42}
*{box-sizing:border-box;margin:0}
body{font:400 1rem/1.6 Outfit,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 90% 0%,#a98bff22,transparent),radial-gradient(50% 40% at 0% 60%,#ff6fa518,transparent)}
h1,h2,h3,.logo{font-family:'Bodoni Moda',Cairo,serif;line-height:1.12}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:Cairo,sans-serif;line-height:1.3;letter-spacing:0!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
#prog{position:fixed;top:0;inset-inline:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:left;z-index:40}
html[dir=rtl] #prog{transform-origin:right}
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
header.sc{border-color:var(--line);box-shadow:0 8px 30px #0003}
.hb{display:flex;align-items:center;gap:10px;height:70px}
.logo{position:relative;display:inline-block;font-size:1.75rem;font-weight:700;margin-inline-end:auto;padding-inline-end:16px;text-decoration:none;letter-spacing:.08em;color:transparent;background:linear-gradient(100deg,var(--ink) 42%,var(--gold) 50%,var(--ink) 58%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:100% 0}}
.logo::after{content:"";position:absolute;top:4px;inset-inline-end:0;width:11px;height:11px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 2.6s ease-in-out infinite}
.logo i{font-style:normal;display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .7s var(--ease);filter:drop-shadow(0 0 8px #ff6fa588);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 16px #b596ffaa)}}
.logo:hover i{transform:rotate(180deg)}
html[dir=rtl] .logo{font-family:'Bodoni Moda',serif}
.logo svg{width:20px;height:20px;color:var(--gold);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:rotate(90deg) scale(.7)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:8px 20px;font-weight:600;text-decoration:none;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0004}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ico{width:42px;height:42px;padding:0}
.btn.ico svg{transition:transform .4s var(--ease)}
.btn.ico:hover svg{transform:rotate(25deg) scale(1.1)}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}
.btn.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hot{background:var(--grad);background-size:200% 100%;color:var(--onhot);border:0;font-weight:700;transition:transform .25s var(--ease),box-shadow .25s,background-position .5s}
.btn.hot:hover{background-position:100% 0;box-shadow:0 12px 30px #ff6fa555}
.btn.hot::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff70 50%,transparent 65%);transform:translateX(-120%)}
.btn.hot:hover::after{transform:translateX(120%);transition:transform .8s}
.btn.light{background:#ffffff14;border-color:var(--line);backdrop-filter:blur(8px)}
.btn.on{background:var(--gold);border-color:var(--gold);color:#1b0f26}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.hero{position:relative;overflow:hidden;background:var(--hero);border:1px solid var(--line);border-radius:38px;margin-top:12px;padding:64px 56px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;min-height:560px;--mx:70%;--my:30%}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),var(--spot),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(120deg,#000,transparent 65%);-webkit-mask-image:linear-gradient(120deg,#000,transparent 65%)}
.b{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--bo);animation:drift 14s ease-in-out infinite alternate}
.b1{width:360px;height:360px;background:var(--rose);top:-110px;inset-inline-start:-70px}
.b2{width:300px;height:300px;background:var(--gold);bottom:-120px;inset-inline-end:22%;animation-delay:-5s}
.b3{width:280px;height:280px;background:var(--orc);top:6%;inset-inline-end:-70px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.25)}}
.ht{position:relative;z-index:1}
.ht>*{animation:up .9s var(--ease) both}
.ht>:nth-child(2){animation-delay:.12s}.ht>:nth-child(3){animation-delay:.24s}.ht>:nth-child(4){animation-delay:.36s}.ht>:nth-child(5){animation-delay:.48s}
.hero h1{font-size:clamp(2.8rem,6.6vw,5.2rem);font-weight:700;letter-spacing:-.03em}
.hero p{max-width:46ch;margin:20px 0 28px;color:var(--mute);font-size:1.12rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{padding:12px 26px}
.soc{display:flex;gap:10px;margin-top:22px}
.soc a,.fsoc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);color:var(--ink);transition:transform .3s var(--ease),background .25s,color .25s,border-color .25s}
.soc svg,.fsoc svg{width:20px;height:20px}
.soc a:hover,.fsoc a:hover{transform:translateY(-4px) rotate(-6deg);background:var(--c);border-color:var(--c);color:#fff}
[data-soc=wa]{--c:#25d366}[data-soc=tt]{--c:#fe2c55}[data-soc=ig]{--c:#e1306c}[data-soc=fb]{--c:#1877f2}
.perks{display:flex;gap:8px 20px;flex-wrap:wrap;margin-top:26px;color:var(--mute);font-size:.92rem}
.perks span::before{content:"Ø ";color:var(--gold);font-family:'Bodoni Moda',serif;font-weight:700}
.art{position:relative;z-index:1;width:100%;max-width:430px;justify-self:center;overflow:visible;color:var(--ink)}
.orb{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.orb.r{animation-duration:26s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:flt 5s ease-in-out infinite alternate}.f2{animation-delay:-2s}.f3{animation-delay:-3.5s}
@keyframes flt{to{transform:translateY(-16px)}}
.sp{transform-box:fill-box;transform-origin:center;animation:twk 2.6s ease-in-out infinite}
.sp.d{animation-delay:-1.2s}
.sl{animation:dr 1.8s .5s var(--ease) both}
@keyframes dr{from{stroke-dashoffset:420}}
@keyframes twk{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.tile{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:150px;padding:26px 30px;border:0;border-radius:30px;color:#fff;text-align:start;transition:transform .4s var(--ease),box-shadow .4s}
.tile.w{background:linear-gradient(135deg,#ff7fb0,#8f6cf2)}
.tile.m{background:linear-gradient(135deg,#1f7f8e,#22366b)}
.tile::after{content:"♀";position:absolute;inset-inline-end:70px;top:-30px;font-size:11rem;line-height:1;opacity:.16;transition:transform .6s var(--ease)}
.tile.m::after{content:"♂"}
.tile:hover{transform:translateY(-5px);box-shadow:0 24px 46px #0006}
.tile:hover::after{transform:rotate(-12deg) scale(1.1)}
.tx{position:relative;z-index:1;display:grid;gap:4px}
.tx b{font:700 1.9rem 'Bodoni Moda',Cairo,serif}
html[dir=rtl] .tx b{font-family:Cairo,sans-serif}
.tx small{font-size:.95rem;opacity:.88;max-width:32ch}
.go{position:relative;z-index:1;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff2e;backdrop-filter:blur(6px);transition:transform .4s var(--ease),background .3s}
.go svg{width:22px;height:22px}
html[dir=rtl] .go svg{transform:scaleX(-1)}
.tile:hover .go{transform:scale(1.15);background:#fff;color:#22143a}
.mq{overflow:hidden;background:var(--grad);color:var(--onhot);margin-top:40px;transform:rotate(-1deg);width:104%;margin-inline-start:-2%}
.mq div{display:flex;width:max-content;animation:mq 30s linear infinite;direction:ltr;padding:12px 0}
.mq span{font:700 1.15rem 'Bodoni Moda',Cairo,serif;font-style:italic;padding-inline:24px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-25%)}}
.shop{padding-top:64px;scroll-margin-top:70px}
h2{font-size:clamp(2rem,4.4vw,2.9rem);font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.sub{color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 0}
#chips{margin:14px 0 26px}
#q{max-width:290px;border-radius:999px;padding:10px 20px;margin-inline-end:auto;background:var(--surf)}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:7px 20px;border-radius:999px;font-weight:600;color:var(--mute);transition:background .3s,color .3s}
.seg button:hover{color:var(--ink)}
.seg .on{background:var(--grad);color:var(--onhot)}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 18px;font-weight:600;transition:transform .25s var(--ease),background .25s,border-color .25s}
.chip:hover{transform:translateY(-2px);border-color:var(--gold)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:22px;padding-bottom:72px}
.card{background:var(--surf);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);animation:up .6s var(--ease) both;animation-delay:var(--d,0ms);transition:transform .2s,box-shadow .4s,border-color .4s}
.card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px);box-shadow:var(--sh);border-color:var(--gold)}
.pic{aspect-ratio:4/4.6;background-repeat:no-repeat;position:relative;overflow:hidden}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff55,#0000 45%,#0000003a);pointer-events:none}
.pic::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.card:hover .pic::before{transform:translateX(130%);transition:transform .9s}
.ic{position:absolute;inset:0;margin:auto;width:44%;color:#fff;filter:drop-shadow(0 10px 16px #0005);transition:transform .6s var(--ease)}
.card:hover .ic{transform:translateY(-8px) rotate(-6deg) scale(1.1)}
.bd{position:absolute;top:12px;inset-inline-start:12px;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(8px);color:var(--ink);font-size:1.05rem;border:1px solid var(--line)}
.card .in{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.1rem;font-weight:700}
.price{font-weight:600;color:var(--gold);font-size:1.05rem;margin-top:auto}
.card .btn{width:100%;margin-top:6px}
.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(.94)}}
.adm{display:none;gap:6px}
.edit .adm{display:flex}
.adm button{flex:1;font-size:.85rem;border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:4px}
.empty{grid-column:1/-1;padding:48px;text-align:center;border:2px dashed var(--line);border-radius:26px;color:var(--mute)}
.steps{background:var(--bg2);padding-block:72px;border-block:1px solid var(--line)}
.steps ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:32px;counter-reset:s}
.steps li{counter-increment:s;padding-top:18px;border-top:2px solid var(--line);position:relative}
.steps li::after{content:"";position:absolute;top:-2px;inset-inline-start:0;width:0;height:2px;background:var(--grad);transition:width 1.2s var(--ease) .3s}
.steps li.in::after{width:100%}
.steps li::before{content:counter(s);display:block;font:700 4.4rem 'Bodoni Moda',serif;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--gold)}
.steps h3{margin:8px 0 4px}
.steps p{color:var(--mute)}
footer{padding:44px 0 100px;color:var(--mute);font-size:.92rem}
.wm{overflow:hidden;padding:64px 0 0}
.wmt{position:relative;display:flex;justify-content:flex-start;direction:ltr;font:700 clamp(4.5rem,27vw,17rem)/.95 'Bodoni Moda',serif;letter-spacing:.02em;user-select:none}
html[dir=rtl] .wmt{justify-content:flex-end}
.wmt span{color:transparent;-webkit-text-stroke:1.5px var(--gold);background:var(--grad) bottom/100% 0% no-repeat;-webkit-background-clip:text;background-clip:text;transition:background-size 1.4s var(--ease) calc(var(--i) * .2s),-webkit-text-stroke-color .3s}
.wmt.in span{background-size:100% 100%}
.wmt:hover span{-webkit-text-stroke-color:var(--rose)}
.wmt .o{display:inline-block;animation:spin 24s linear infinite}
.wmt::after{content:"";position:absolute;top:10%;inset-inline-end:5%;width:clamp(18px,3vw,34px);aspect-ratio:1;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 2.6s ease-in-out infinite}
.fb{display:flex;align-items:center;gap:14px}
.fmark{font:700 2.6rem 'Bodoni Moda',serif;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.fsoc{display:flex;gap:10px}
.fabs{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fabs .mini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--ink);transition:transform .3s var(--ease),background .25s,color .25s}
.fabs .mini svg{width:20px;height:20px}
.fabs .mini:hover{transform:translateX(calc(var(--sx) / -12)) scale(1.1);background:var(--c);color:#fff;border-color:var(--c)}
.fab{position:relative;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;box-shadow:0 10px 28px #25d36666;transition:transform .25s var(--ease)}
.fab svg{width:22px;height:22px}
.fab::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #25d366;animation:ring 2.4s ease-out infinite}
@keyframes ring{to{transform:scale(1.35);opacity:0}}
.fab:hover{transform:translateY(-3px)}
#toast{position:fixed;inset-inline:0;bottom:96px;margin-inline:auto;width:max-content;max-width:90vw;background:var(--grad);color:var(--onhot);padding:10px 24px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transform:translateY(16px);transition:.3s;pointer-events:none;box-shadow:0 12px 30px #0006}
#toast.show{opacity:1;transform:none}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s var(--ease)}
.js .rv.in{opacity:1;transform:none}
dialog{border:1px solid var(--line);border-radius:26px;padding:26px;width:min(460px,94vw);max-height:92vh;overflow:auto;background:var(--surf);color:var(--ink);animation:dp .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--sh)}
dialog::backdrop{background:#0a0610c4;backdrop-filter:blur(5px)}
@keyframes dp{from{opacity:0;transform:scale(.94) translateY(12px)}}
#dCart{margin:0;margin-inline-start:auto;height:100dvh;max-height:100dvh;border-radius:0;border-width:0 0 0 1px;width:min(420px,100vw);animation:sl .4s var(--ease)}
html[dir=rtl] #dCart{border-width:0 1px 0 0}
@keyframes sl{from{transform:translateX(var(--sx))}}
dialog h3{font-size:1.6rem;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.9rem;margin-top:10px;color:var(--mute)}
input,select{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--ink);transition:border-color .25s,box-shadow .25s}
input:focus,select:focus{outline:0;border-color:var(--rose);box-shadow:0 0 0 4px #ff6fa524}
textarea{width:100%;margin-top:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--ink);font:.8rem/1.5 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;resize:vertical}
.warn{margin-top:10px;padding:10px 14px;border-radius:14px;background:#ffb52e22;border:1px solid #ffb52e66;color:var(--ink);font-size:.9rem}
input[type=range]{padding:0;accent-color:var(--rose)}
input[type=color]{height:42px;padding:2px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.prev{width:120px;aspect-ratio:1;border-radius:16px;background-repeat:no-repeat;border:1px solid var(--line);margin-top:8px}
.line{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.line b{margin-inline-end:auto}
.line button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surf2);transition:background .2s,transform .2s}
.line button:hover{background:var(--rose);color:#fff;transform:scale(1.1)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.25rem;margin-top:16px}
#tot{color:var(--gold)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:44px 26px}.art{max-width:300px}.steps ol{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.tile::after{inset-inline-end:80px}}
@media(max-width:520px){.fab span{display:none}.fab{padding:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>

const cnt = b => { const n = Object.values(cart).reduce((a, c) => a + c, 0); document.getElementById('cc').textContent = n; if (b) { const c = document.getElementById('cartBtn'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); } };
let tmr;
const toast = m => { const e = document.getElementById('toast'); e.textContent = m || T[lang].added; e.classList.add('show'); clearTimeout(tmr); tmr = setTimeout(() => e.classList.remove('show'), 1600); };
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem('gh_' + k)) || d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem('gh_' + k, JSON.stringify(v)) } catch { alert('Storage full: use smaller photos or image links.') } };

let lang = load('lang', 'en'), edit = false, cat = 'all', gen = 'all', editId = null;
// ==== PRODUCTS START ====
let cats = load('cats', [
  {id:'skin', en:'Skincare', ar:'سكين كير'},
  {id:'hair', en:'Hair care', ar:'هير كير'},
  {id:'cosm', en:'Cosmetics', ar:'كوزمتكس'},
  {id:'acc', en:'Accessories', ar:'اكسسوارز'}
]);
let prods = load('prods', [
  {id:1, en:'Vitamin C serum', ar:'سيروم فيتامين سي', cat:'skin', g:'u', price:350, color:'#e0a526', img:'', z:100, x:50, y:50},
  {id:2, en:'Gentle face wash', ar:'غسول وجه لطيف', cat:'skin', g:'w', price:180, color:'#26b899', img:'', z:100, x:50, y:50},
  {id:3, en:'Nourishing hair oil', ar:'زيت شعر مغذي', cat:'hair', g:'w', price:220, color:'#8b5cf6', img:'', z:100, x:50, y:50},
  {id:4, en:'Silk hair mask', ar:'ماسك شعر حريري', cat:'hair', g:'w', price:260, color:'#f0669f', img:'', z:100, x:50, y:50},
  {id:5, en:'Matte lipstick', ar:'روج مات', cat:'cosm', g:'w', price:150, color:'#e0356f', img:'', z:100, x:50, y:50},
  {id:6, en:'Volume mascara', ar:'ماسكارا', cat:'cosm', g:'w', price:170, color:'#4a3470', img:'', z:100, x:50, y:50},
  {id:7, en:'Pearl hair clip', ar:'كليب لؤلؤ', cat:'acc', g:'w', price:90, color:'#a87be0', img:'', z:100, x:50, y:50},
  {id:8, en:'Gold hoop earrings', ar:'حلق دائري ذهبي', cat:'acc', g:'w', price:130, color:'#c9911d', img:'', z:100, x:50, y:50},
  {id:9, en:'Beard oil', ar:'زيت لحية', cat:'hair', g:'m', price:200, color:'#7a4b2a', img:'', z:100, x:50, y:50},
  {id:10, en:'Charcoal face wash', ar:'غسول فحم للوجه', cat:'skin', g:'m', price:170, color:'#2f4a5e', img:'', z:100, x:50, y:50},
  {id:11, en:'Signature cologne', ar:'كولونيا', cat:'cosm', g:'m', price:480, color:'#1f5f73', img:'', z:100, x:50, y:50},
  {id:12, en:'Leather bracelet', ar:'استيك جلد', cat:'acc', g:'m', price:110, color:'#5b3a29', img:'', z:100, x:50, y:50}
]);
// ==== PRODUCTS END ====
let cart = load('cart', {});

const t = k => T[lang][k];
const nm = o => (lang === 'ar' && o.ar) ? o.ar : o.en;
const pic = p => `background-color:${p.color};` + (p.img ? `background-image:url("${p.img}");background-size:${p.z}%;background-position:${p.x}% ${p.y}%` : '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(e => {
    if (e.dataset.i === 'edit') e.textContent = edit ? t('editOn') : t('edit');
    else e.textContent = t(e.dataset.i);
  });
  $('#lang').textContent = lang === 'ar' ? 'English' : 'عربي';
  $('#q').placeholder = t('search');
  const SOC = {wa:'https://wa.me/' + WA_NUMBER, tt:TIKTOK_URL, ig:INSTAGRAM_URL, fb:FACEBOOK_URL};
  document.querySelectorAll('[data-soc]').forEach(a => a.href = SOC[a.dataset.soc]);
  render();
}

const ICONS = {
  skin:'<path d="M26 8h12v8H26zM28 16v6h8v-6"/><rect x="20" y="22" width="24" height="34" rx="8"/><path d="M26 36h12"/>',
  hair:'<rect x="22" y="22" width="20" height="36" rx="6"/><path d="M28 22v-9h8v9M28 13h12"/><path d="M27 40h10"/>',
  cosm:'<rect x="22" y="38" width="20" height="18" rx="3"/><rect x="25" y="28" width="14" height="10"/><path d="M25 28V14l10-4 4 6v12"/>',
  acc:'<circle cx="32" cy="40" r="15"/><path d="M26 18l6-9 6 9-6 6z"/>',
  x:'<path d="M32 8l5 19 19 5-19 5-5 19-5-19-19-5 19-5z"/>'
};
const icon = id => `<svg class="ic" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id] || ICONS.x}</svg>`;

function render() {
  document.body.classList.toggle('edit', edit);
  $('#edit').classList.toggle('on', edit);
  $('#edit').textContent = edit ? t('editOn') : t('edit');
  $('#gseg').innerHTML = [['all', t('all')], ['w', t('gW')], ['m', t('gM')]].map(([k, l]) => `<button class="${gen === k ? 'on' : ''}" data-g="${k}">${l}</button>`).join('');
  let h = `<button class="chip ${cat === 'all' ? 'on' : ''}" data-cat="all">${t('all')}</button>`;
  cats.forEach(c => h += `<button class="chip ${cat === c.id ? 'on' : ''}" data-cat="${c.id}">${esc(nm(c))}</button>`);
  if (edit) h += `<button class="btn" id="mCats">${t('cats')}</button><button class="btn hot" id="aProd">${t('addProd')}</button><button class="btn" id="mExp">${t('exp')}</button><button class="btn" id="mReset">${t('reset')}</button>`;
  $('#chips').innerHTML = h;
  const mi = cats.map(c => `<span>${esc(nm(c))} Ø</span>`).join('');
  $('#mq').innerHTML = mi + mi + mi + mi;
  const q = ($('#q').value || '').trim().toLowerCase();
  const list = prods.filter(p => (cat === 'all' || p.cat === cat) && (gen === 'all' || !p.g || p.g === 'u' || p.g === gen) && (!q || (p.en + ' ' + p.ar).toLowerCase().includes(q)));
  $('#grid').innerHTML = list.length ? list.map((p, i) => `
    <article class="card" style="--d:${i * 60}ms">
      <div class="pic" style="${pic(p)}" role="img" aria-label="${esc(nm(p))}">${p.img ? '' : icon(p.cat)}${p.g === 'w' ? '<span class="bd">♀</span>' : p.g === 'm' ? '<span class="bd">♂</span>' : ''}</div>
      <div class="in">
        <h3>${esc(nm(p))}</h3>
        <div class="price">${p.price} ${CURRENCY}</div>
        <div class="adm"><button data-e="${p.id}">${t('editB')}</button><button data-d="${p.id}">${t('del')}</button></div>
        <button class="btn fill" data-a="${p.id}">${t('add')}</button>
      </div>
    </article>`).join('') : `<div class="empty">${t('empty')}</div>`;
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $('#cc').textContent = n;
}

function renderCart() {
  let tot = 0, h = '';
  Object.entries(cart).forEach(([id, q]) => {
    const p = prods.find(x => x.id == id); if (!p) return;
    tot += p.price * q;
    h += `<div class="line"><b>${esc(nm(p))}</b><button data-m="${id}">−</button><span>${q}</span><button data-p="${id}">+</button><span>${p.price * q}</span></div>`;
  });
  $('#lines').innerHTML = h || `<p class="sub">${t('cartEmpty')}</p>`;
  $('#tot').textContent = tot + ' ' + CURRENCY;
  $('#toCheck').disabled = !h;
  return tot;
}

function setCart(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  save('cart', cart); renderCart(); cnt(d > 0);
}

// ---- Product dialog ----
function fillCats() { $('#pCat').innerHTML = cats.map(c => `<option value="${c.id}">${esc(nm(c))}</option>`).join(''); }
function updPrev() {
  $('#prev').setAttribute('style', pic({color:$('#pCol').value, img:$('#pUrl').value, z:$('#pZ').value, x:$('#pX').value, y:$('#pY').value}));
}
function openProd(p) {
  editId = p ? p.id : null; fillCats();
  $('#pEn').value = p ? p.en : ''; $('#pAr').value = p ? p.ar : '';
  $('#pCat').value = p ? p.cat : (cat !== 'all' ? cat : cats[0].id);
  $('#pG').value = p ? (p.g || 'u') : (gen !== 'all' ? gen : 'u');
  $('#pUrl').value = p ? p.img : ''; $('#pFile').value = '';
  $('#pZ').value = p ? p.z : 100; $('#pX').value = p ? p.x : 50; $('#pY').value = p ? p.y : 50;
  $('#pPr').value = p ? p.price : ''; $('#pCol').value = p ? p.color : '#f2542d';
  updPrev(); $('#dProd').showModal();
}
['pUrl','pZ','pX','pY','pCol'].forEach(i => $('#' + i).addEventListener('input', updPrev));
$('#pFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => { // shrink so it fits in browser storage
      const s = Math.min(1, 600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      $('#pUrl').value = c.toDataURL('image/jpeg', .8); updPrev();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
});
$('#fProd').addEventListener('submit', () => {
  const o = {en:$('#pEn').value.trim(), ar:$('#pAr').value.trim(), cat:$('#pCat').value, g:$('#pG').value, img:$('#pUrl').value.trim(),
    z:+$('#pZ').value, x:+$('#pX').value, y:+$('#pY').value, price:+$('#pPr').value, color:$('#pCol').value};
  if (editId) Object.assign(prods.find(p => p.id === editId), o);
  else prods.push({id:Date.now(), ...o});
  save('prods', prods); render();
});

// ---- Categories ----
function renderCatList() {
  $('#catList').innerHTML = cats.map(c => `<div class="line"><b>${esc(c.en)} / ${esc(c.ar)}</b><button data-dc="${c.id}" aria-label="${t('del')}">✕</button></div>`).join('');
}
$('#addCat').onclick = () => {
  const en = $('#cEn').value.trim(), ar = $('#cAr').value.trim();
  if (!en && !ar) return;
  cats.push({id:'c' + Date.now(), en:en || ar, ar:ar || en});
  $('#cEn').value = $('#cAr').value = ''; save('cats', cats); renderCatList(); render();
};
$('#catList').onclick = e => {
  const id = e.target.dataset.dc; if (!id || cats.length < 2 || !confirm(t('delCat'))) return;
  cats = cats.filter(c => c.id !== id);
  prods.forEach(p => { if (p.cat === id) p.cat = cats[0].id; });
  if (cat === id) cat = 'all';
  save('cats', cats); save('prods', prods); renderCatList(); render();
};

// ---- Global clicks ----
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.g) { gen = d.g; render(); if (b.classList.contains('tile')) $('#shop').scrollIntoView({behavior:'smooth'}); }
  else if (d.cat) { cat = d.cat; render(); }
  else if (d.a) { setCart(d.a, 1); toast(); b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 400); }
  else if (d.e) { openProd(prods.find(p => p.id == d.e)); }
  else if (d.d) { if (confirm(t('del') + '?')) { prods = prods.filter(p => p.id != d.d); delete cart[d.d]; save('prods', prods); save('cart', cart); render(); } }
  else if (d.m) setCart(d.m, -1);
  else if (d.p) setCart(d.p, 1);
  else if (d.close !== undefined) b.closest('dialog').close();
  else if (b.id === 'aProd') openProd(null);
  else if (b.id === 'mExp') openExport();
  else if (b.id === 'mReset') { if (confirm(t('resetQ'))) { try { localStorage.removeItem('gh_prods'); localStorage.removeItem('gh_cats'); } catch {} location.reload(); } }
  else if (b.id === 'mCats') { renderCatList(); $('#dCats').showModal(); }
});
$('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; save('lang', lang); applyLang(); };
$('#edit').onclick = () => { edit = !edit; render(); };
$('#cartBtn').onclick = () => { renderCart(); $('#dCart').showModal(); };
$('#toCheck').onclick = () => { $('#dCart').close(); $('#dCheck').showModal(); };
$('#back').onclick = () => { $('#dCheck').close(); renderCart(); $('#dCart').showModal(); };
$('#fCheck').addEventListener('submit', e => {
  e.preventDefault();
  let m = `NØVA – ${t('order')}\n`;
  Object.entries(cart).forEach(([id, q]) => { const p = prods.find(x => x.id == id); if (p) m += `• ${p.en} × ${q} = ${p.price * q} ${CURRENCY}\n`; });
  m += `\n${t('total')}: ${renderCart()} ${CURRENCY}\n${t('fName')}: ${$('#cN').value}\n${t('fAddr')}: ${$('#cA').value}\n${t('fTel')}: ${$('#cT').value}`;
  window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(m), '_blank');
});

// ---- Admin unlock: open your site once with  index.html#ADMIN_KEY  ----
if (location.hash === '#' + ADMIN_KEY) {
  save('admin', true);
  history.replaceState(null, '', location.pathname + location.search); // remove the key from the address bar
}
$('#edit').hidden = !load('admin', false);

document.documentElement.classList.add('js');
$('#q').addEventListener('input', render);
addEventListener('scroll', () => document.querySelector('header').classList.toggle('sc', scrollY > 10), {passive:true});
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.15}) : null;
document.querySelectorAll('.rv').forEach(e => io ? io.observe(e) : e.classList.add('in'));

// ---- Export products as code ----
function openExport() {
  const big = prods.filter(p => /^data:/.test(p.img || ''));
  const clean = prods.map(p => /^data:/.test(p.img || '') ? {...p, img:''} : p);
  const ser = a => '[\n' + a.map(o => '  ' + JSON.stringify(o)).join(',\n') + '\n]';
  $('#expTa').value = `let cats = load('cats', ${ser(cats)});\nlet prods = load('prods', ${ser(clean)});`;
  const w = $('#expW');
  w.hidden = !big.length;
  w.textContent = big.length ? t('expW') + ' ' + big.map(p => p.en).join(', ') : '';
  $('#dExp').showModal();
}
$('#expCopy').onclick = async () => {
  const ta = $('#expTa');
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
  toast(t('copied'));
};

// ---- Theme, progress bar, hero glow, card tilt ----
$('#theme').onclick = () => {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n;
  try { localStorage.setItem('gh_theme', n); } catch {}
};
addEventListener('scroll', () => {
  const h = document.documentElement;
  $('#prog').style.transform = `scaleX(${Math.min(1, scrollY / Math.max(1, h.scrollHeight - innerHeight))})`;
}, {passive:true});
const hero = $('.hero');
hero.addEventListener('pointermove', e => {
  const r = hero.getBoundingClientRect();
  hero.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  hero.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
$('#grid').addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const c = e.target.closest('.card'); if (!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  c.style.setProperty('--rx', (-y * 6) + 'deg'); c.style.setProperty('--ry', (x * 8) + 'deg');
});
$('#grid').addEventListener('pointerout', e => {
  const c = e.target.closest('.card');
  if (c && !c.contains(e.relatedTarget)) { c.style.removeProperty('--rx'); c.style.removeProperty('--ry'); }
});

applyLang();
</script>
</body>
</html>
